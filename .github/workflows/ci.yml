# GEV v2 CI — PLAN.md §13. Green on main from commit one (upstream lesson #44/#54).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # turbo --affected needs history
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, unit tests (seed mode — zero live API calls)
        run: pnpm turbo run lint typecheck test --affected
        env:
          GEV_SEED_MODE: '1'
      - name: Performance gates (isolated single workers)
        run: pnpm test:performance
        env:
          GEV_SEED_MODE: '1'
      - name: ADG — documentation must match code
        run: pnpm docs:check
      - name: Documentation guard and generated-section tests
        run: pnpm docs:test
      - name: Provider registry generated-document parity
        run: pnpm docs:providers:check
      - name: Architectural drift inventory
        run: pnpm architecture:check

  build:
    name: build all
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
        env:
          GEV_SEED_MODE: '1'
      - name: Enforce bundle size budgets (PLAN.md §13)
        run: pnpm check:budgets

  e2e:
    name: playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
        env:
          GEV_SEED_MODE: '1'
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run smoke specs (condition-waits only — never fixed sleeps)
        run: pnpm e2e
        env:
          GEV_SEED_MODE: '1'
      - name: 'Upload globe visual screenshot artifact (Rule 2: visual evidence)'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globe-screenshot-evidence
          path: e2e/test-results/
          retention-days: 14
