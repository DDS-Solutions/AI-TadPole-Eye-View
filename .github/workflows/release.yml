# Release automation using release-please per VERSION_CONTROL.md §7.
# Disabled by default: a human may set GEV_RELEASES_ENABLED=true only after the
# documented release-evidence gate is satisfied.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ vars.GEV_RELEASES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
