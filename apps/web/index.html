<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GEV v2 — Agent-Native OSINT Console</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      border: 1px solid #1e293b;
      background-color: #0f172a;
      border-radius: 8px;
      padding: 2rem 3rem;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin-top: 0;
      color: #38bdf8;
      font-size: 1.75rem;
    }
    p {
      color: #94a3b8;
    }
    .status {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background-color: #1e3a8a;
      color: #93c5fd;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card" id="app-root">
    <h1 id="app-title">GEV v2 — God's Eye View</h1>
    <p>Agent-Native OSINT Console · Phase 0 Scaffold</p>
    <div class="status" id="app-status">SCAFFOLD READY</div>
  </div>
</body>
</html>
